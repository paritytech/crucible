[package]
name = "crucible"
description = "Draft non-functional testing framework for Polkadot SDK networks"
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
too_many_lines = "warn"
